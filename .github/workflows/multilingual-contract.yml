name: multilingual contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check version consistency
        run: python3 scripts/check_versions.py
      - name: Run upstream and multilingual unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install optional MCP SDK for integration tests
        run: python3 -m pip install -r sepia_mcp/requirements.txt
      - name: Test MCP integration
        run: python3 -m unittest discover -s tests -p 'test_mcp_server.py' -v
      - name: Check committed whitespace errors
        run: git show --check --oneline --no-renames HEAD
